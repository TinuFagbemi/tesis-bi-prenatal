services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}"
    ports:
      # Publicado solo en la interfaz local. Se usa 5433 en la computadora para no
      # chocar con el PostgreSQL instalado directamente en Windows (localhost:5432).
      # El puerto interno del contenedor sigue siendo 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fetalalert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: "${APP_NAME:-FetalAlert API}"
      APP_ENV: "${APP_ENV:-development}"
      # Debe apuntar a db:5432 (red interna de Docker), nunca a localhost:5433.
      #
      # Es la credencial del runtime restringido, y es la unica URL de base que
      # este servicio recibe (SCRUM-98). ALEMBIC_DATABASE_URL y ETL_DATABASE_URL
      # NO se pasan aqui, a proposito: el proceso web no ejecuta migraciones ni
      # el ETL, y entregarle la credencial del migrador anularia el aislamiento
      # por filas -- el propietario de una tabla omite sus politicas. Si alguna
      # vez hace falta migrar, se hace desde un proceso aparte con su propia
      # variable, nunca desde este contenedor.
      DATABASE_URL: "${DATABASE_URL:?Define DATABASE_URL en el archivo .env}"
      # Material de firma de los tokens (SCRUM-70). Se pasa de forma explicita y
      # sin valor funcional por omision: si falta o no es valido, app.main se
      # niega a arrancar. No se usa ":?" a proposito: procesar este archivo o
      # levantar solo "db" (migraciones, cargador, ETL) no debe depender de una
      # credencial que esos componentes no usan. EDGE_API_TOKEN no se pasa: es
      # del nodo edge, no de la API.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      JWT_EXPIRATION_MINUTES: "${JWT_EXPIRATION_MINUTES:-30}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Herramienta auxiliar de inspeccion visual para la sustentacion (SCRUM-103).
  # No es un componente de FetalAlert: ningun servicio depende de ella y el
  # sistema funciona igual con ella apagada. Pertenece al perfil "demo", asi que
  # un arranque ordinario sin perfiles ("docker compose up -d") no la inicia.
  # Compose si la inicia si se nombra el servicio explicitamente; el
  # procedimiento del proyecto usa siempre "--profile demo". Ver
  # docs/demo_adminer.md.
  #
  # - Imagen oficial con version fija, sin plugins ni tema.
  # - Publicada solo en la interfaz local de la computadora.
  # - Llega a PostgreSQL por la red interna (db:5432), no por el puerto publicado.
  # - No recibe ninguna credencial: usuario y contrasena se escriben en el
  #   formulario de inicio de sesion de Adminer.
  # - PGOPTIONS abre cada sesion de Adminer con transacciones de solo lectura por
  #   omision. Es una proteccion contra escrituras accidentales, no un limite de
  #   privilegios: los privilegios son los del rol con el que se inicia sesion.
  adminer:
    image: adminer:6.1.1-standalone
    profiles: ["demo"]
    environment:
      PGOPTIONS: "-c default_transaction_read_only=on"
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fetalalert_pgdata:
