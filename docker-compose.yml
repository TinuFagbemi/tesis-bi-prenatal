services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}"
    ports:
      # Publicado solo en la interfaz local. Se usa 5433 en la computadora para no
      # chocar con el PostgreSQL instalado directamente en Windows (localhost:5432).
      # El puerto interno del contenedor sigue siendo 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fetalalert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: "${APP_NAME:-FetalAlert API}"
      APP_ENV: "${APP_ENV:-development}"
      # Debe apuntar a db:5432 (red interna de Docker), nunca a localhost:5433.
      DATABASE_URL: "${DATABASE_URL:?Define DATABASE_URL en el archivo .env}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fetalalert_pgdata:
