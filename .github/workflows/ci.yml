name: CI

# Integración continua únicamente: instala, prueba y reporta.
# Este workflow no despliega nada ni publica artefactos.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Pruebas del backend (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest

    # Fuente única de las credenciales de PostgreSQL del job: el servicio y la
    # URL de las pruebas las leen de aquí, para que no puedan desincronizarse
    # entre sí.
    env:
      # Credenciales ficticias, efímeras y exclusivas de GitHub Actions:
      # viven solo dentro de este job y desaparecen al terminar. No son
      # secretos, no corresponden a ningún entorno real y no deben reutilizarse
      # fuera de aquí. Por eso van en claro y no como secrets del repositorio.
      POSTGRES_USER: fetalalert_ci
      POSTGRES_PASSWORD: ci_efimero_no_es_secreto
      # La base debe llamarse exactamente así: test_migration_postgresql.py
      # aborta contra cualquier otro nombre, porque el ciclo de validación
      # borra y recrea el esquema operacional completo.
      POSTGRES_DB: scrum52_validacion_tmp
      # Material de firma ficticio, efimero y exclusivo de este job: se
      # genera para esta ejecucion, vive solo dentro de ella y desaparece al
      # terminar. No corresponde a ningun entorno y no debe reutilizarse
      # fuera de aqui. Por eso va en claro y no como secret del repositorio,
      # igual que las credenciales de PostgreSQL de arriba.
      #
      # Es distinto de POSTGRES_PASSWORD a proposito: la aplicacion rechaza
      # arrancar si la clave de firma repite la de la base.
      JWT_SECRET_KEY: ci_efimero_no_es_secreto_clave_de_firma_de_pruebas

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # El health check solo espera a que PostgreSQL acepte conexiones, para
        # que las pruebas no corran contra un servidor todavía inicializándose.
        # Las credenciales y la base dedicada no se comprueban aquí: eso lo
        # valida el step de pruebas contra PostgreSQL, que se conecta con
        # SCRUM52_TEST_DATABASE_URL.
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Primera capa: todo lo que no necesita un servidor PostgreSQL
      # (API, modelos, migración renderizada offline, dataset simulado,
      # validación del cargador, contratos Pydantic, capa HTTP del endpoint y
      # el nodo edge simulado, que usa archivos SQLite temporales propios).
      #
      # Aquí corren también la política de reintentos, la migración local
      # v1 -> v2 del almacenamiento del edge, la sincronización diferida con
      # reloj y sleeper inyectados, y la traza. Ninguna duerme de verdad: el
      # sleeper anota la espera y adelanta un reloj falso, así que una espera de
      # setenta segundos no cuesta setenta segundos de CI.
      - name: Pruebas sin servidor PostgreSQL
        working-directory: backend
        run: |
          python -m pytest -q \
            --ignore=tests/test_migration_postgresql.py \
            --ignore=tests/test_load_mock_data_postgresql.py \
            --ignore=tests/test_ingestion_api_postgresql.py \
            --ignore=tests/test_ingestion_idempotency_postgresql.py \
            --ignore=tests/test_edge_postgresql.py \
            --ignore=tests/test_edge_sincronizacion_postgresql.py \
            --ignore=tests/test_etl_postgresql.py \
            --ignore=tests/test_autenticacion_postgresql.py \
            --ignore=tests/test_cuentas_postgresql.py

      # Contrato del camino .env/shell -> docker-compose.yml -> entorno del
      # contenedor de la API. Las pruebas de Python reciben JWT_SECRET_KEY
      # directamente del entorno de este job, asi que nunca recorren ese camino:
      # un servicio api que no recibiera la variable pasaba el CI y no arrancaba
      # con Docker Compose.
      #
      # Solo resuelve el modelo con "docker compose config": no construye
      # imagenes ni arranca contenedores. Cada caso parte de un entorno
      # controlado -- sin las variables de este job y con un --env-file vacio,
      # para que ningun .env intervenga -- y usa valores ficticios. El modelo
      # resuelto no se imprime nunca, porque contiene valores de entorno.
      - name: Contrato de Docker Compose para la API (SCRUM-70)
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile

          # Valores ficticios, exclusivos de esta comprobacion.
          FICTICIAS = {
              "POSTGRES_USER": "compose_contrato",
              "POSTGRES_PASSWORD": "compose_contrato_no_es_secreto",
              "POSTGRES_DB": "compose_contrato",
              "DATABASE_URL": (
                  "postgresql+psycopg://compose_contrato:"
                  "compose_contrato_no_es_secreto@db:5432/compose_contrato"
              ),
          }
          SECRETO_FICTICIO = "compose_contrato_clave_ficticia_de_firma_0123456789"
          TOKEN_EDGE_FICTICIO = "compose_contrato_token_edge_ficticio"
          ENTORNO_DE_LA_API = {
              "APP_NAME",
              "APP_ENV",
              "DATABASE_URL",
              "JWT_SECRET_KEY",
              "JWT_EXPIRATION_MINUTES",
          }
          # Prefijos que el caso controla: se retiran del entorno heredado.
          CONTROLADAS = ("APP_", "COMPOSE_", "DATABASE_URL", "EDGE_", "JWT_", "POSTGRES_")

          fallos = []


          def comprobar(condicion, descripcion):
              if condicion:
                  print(f"OK: {descripcion}")
              else:
                  print(f"::error::Contrato de Compose roto: {descripcion}")
                  fallos.append(descripcion)


          def resolver(caso, **variables):
              """Modelo resuelto por Compose con exactamente estas variables."""
              entorno = {
                  clave: valor
                  for clave, valor in os.environ.items()
                  if not clave.startswith(CONTROLADAS)
              }
              entorno.update(FICTICIAS)
              entorno.update(variables)

              with tempfile.NamedTemporaryFile("w", suffix=".env", delete=False) as vacio:
                  env_file_vacio = vacio.name
              try:
                  resultado = subprocess.run(
                      [
                          "docker", "compose",
                          "-f", "docker-compose.yml",
                          "--env-file", env_file_vacio,
                          "config", "--format", "json",
                      ],
                      env=entorno,
                      capture_output=True,
                      text=True,
                  )
              finally:
                  os.unlink(env_file_vacio)

              comprobar(
                  resultado.returncode == 0,
                  f"{caso}: docker compose config resuelve el proyecto "
                  f"(codigo {resultado.returncode})",
              )
              if resultado.returncode != 0:
                  return None, ""
              return json.loads(resultado.stdout), resultado.stdout


          # 1. Clave definida y expiracion ausente.
          modelo, texto = resolver(
              "con JWT_SECRET_KEY",
              JWT_SECRET_KEY=SECRETO_FICTICIO,
              EDGE_API_TOKEN=TOKEN_EDGE_FICTICIO,
          )
          if modelo is not None:
              api = modelo["services"]["api"].get("environment") or {}
              db = modelo["services"]["db"].get("environment") or {}
              comprobar(
                  api.get("JWT_SECRET_KEY") == SECRETO_FICTICIO,
                  "con JWT_SECRET_KEY: el servicio api la recibe exactamente",
              )
              comprobar(
                  api.get("JWT_EXPIRATION_MINUTES") == "30",
                  "sin JWT_EXPIRATION_MINUTES: el servicio api recibe 30",
              )
              comprobar(
                  set(api) == ENTORNO_DE_LA_API,
                  "el servicio api recibe solo " + ", ".join(sorted(ENTORNO_DE_LA_API)),
              )
              comprobar(
                  "EDGE_API_TOKEN" not in api and TOKEN_EDGE_FICTICIO not in texto,
                  "EDGE_API_TOKEN no se inyecta en ningun servicio",
              )
              comprobar(
                  not any(clave.startswith("JWT_") for clave in db),
                  "el servicio db no recibe material JWT",
              )

          # 2. Clave ausente: el proyecto se resuelve y la API la recibe vacia.
          modelo, _ = resolver("sin JWT_SECRET_KEY")
          if modelo is not None:
              api = modelo["services"]["api"].get("environment") or {}
              comprobar(
                  api.get("JWT_SECRET_KEY") == "",
                  "sin JWT_SECRET_KEY: el servicio api la recibe vacia y es "
                  "app.main quien falla cerrado",
              )
              comprobar(
                  api.get("JWT_EXPIRATION_MINUTES") == "30",
                  "sin JWT_SECRET_KEY: la expiracion sigue siendo 30",
              )

          # 3. Expiracion configurada: llega tal cual; Pydantic aplica sus limites.
          modelo, _ = resolver(
              "con JWT_EXPIRATION_MINUTES",
              JWT_SECRET_KEY=SECRETO_FICTICIO,
              JWT_EXPIRATION_MINUTES="45",
          )
          if modelo is not None:
              api = modelo["services"]["api"].get("environment") or {}
              comprobar(
                  api.get("JWT_EXPIRATION_MINUTES") == "45",
                  "con JWT_EXPIRATION_MINUTES: el servicio api recibe el valor configurado",
              )

          sys.exit(1 if fallos else 0)
          PY

      # Segunda capa: ciclo real upgrade -> downgrade -> upgrade -> alembic check
      # contra el servicio PostgreSQL de arriba. Corre antes que las pruebas del
      # cargador porque es quien deja la base desplegada en el head de Alembic,
      # que es justo lo que el cargador exige y no prepara por su cuenta.
      - name: Pruebas de migración contra PostgreSQL (SCRUM-52)
        working-directory: backend
        env:
          SCRUM52_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_migration_postgresql.py --junitxml=pytest-postgresql.xml

      # Tercera capa: carga idempotente del dataset simulado sobre la misma base
      # efímera, que el step anterior dejó en head y vacía. Estas pruebas no
      # migran nada y revierten siempre su transacción, así que la base queda
      # como estaba; por eso pueden compartir la base sin pisar a SCRUM-52.
      - name: Pruebas del cargador contra PostgreSQL (SCRUM-61)
        working-directory: backend
        env:
          APP_ENV: ci
          SCRUM61_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_load_mock_data_postgresql.py --junitxml=pytest-scrum61.xml

      # Cuarta capa: el endpoint de ingesta contra la misma base efímera. No
      # migra, no crea y no borra: cada prueba abre una transacción exterior que
      # revierte siempre, y la Session del endpoint se une a ella por SAVEPOINT,
      # de modo que su commit es real y observable pero no sobrevive. La base
      # queda como estaba, así que puede compartirse con SCRUM-52 y SCRUM-61.
      - name: Pruebas del endpoint contra PostgreSQL (SCRUM-62)
        working-directory: backend
        env:
          SCRUM62_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_ingestion_api_postgresql.py --junitxml=pytest-scrum62.xml

      # Quinta capa: la idempotencia del endpoint, sobre la misma base efímera.
      # Sus pruebas secuenciales usan el mismo aislamiento por transacción
      # revertida que SCRUM-62. Las concurrentes no pueden: dos transacciones
      # distintas no ven las filas sin confirmar de una tercera, así que esas
      # confirman sus referencias y luego borran exactamente lo que crearon, en
      # orden inverso de llaves foráneas. La base vuelve a quedar vacía.
      #
      # Va la última y en un step propio a propósito. Ejecuta DDL real -- baja y
      # vuelve a subir la revisión de SCRUM-63 -- y sus pruebas concurrentes
      # toman un candado exclusivo sobre 'embarazo' mientras dos peticiones
      # esperan. En serie es seguro; compartir la base con otra suite corriendo
      # a la vez no lo sería, y por eso no hay matriz ni paralelización.
      - name: Pruebas de idempotencia contra PostgreSQL (SCRUM-63)
        working-directory: backend
        env:
          SCRUM63_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_ingestion_idempotency_postgresql.py --junitxml=pytest-scrum63.xml

      # Sexta capa: el ciclo real del nodo edge simulado -- SQLite temporal ->
      # cliente HTTP -> endpoint de FastAPI -> PostgreSQL --, sobre la misma base
      # efímera. Usa el mismo aislamiento por transacción revertida que SCRUM-62
      # y SCRUM-63, no ejecuta DDL y no borra nada, así que la base queda como
      # estaba.
      #
      # Va después de SCRUM-63 a propósito: aquella capa baja y vuelve a subir su
      # revisión y toma candados exclusivos, y compartir la base con otra suite
      # corriendo a la vez no sería seguro. En serie sí lo es.
      #
      # SQLite no necesita ningún servicio adicional: cada prueba crea su archivo
      # dentro del ``tmp_path`` que le da pytest, y el runner lo descarta al
      # terminar.
      - name: Pruebas del nodo edge contra PostgreSQL (SCRUM-64)
        working-directory: backend
        env:
          SCRUM64_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_edge_postgresql.py --junitxml=pytest-scrum64.xml

      # Séptima capa: la sincronización resiliente del nodo edge -- reintentos
      # con espera incremental, reconciliación de un intento que quedó sin
      # resultado, agotamiento y trazabilidad extremo a extremo -- sobre la misma
      # base efímera. Reutiliza el mismo aislamiento por transacción revertida
      # que SCRUM-62, SCRUM-63 y SCRUM-64: no ejecuta DDL y no borra nada.
      #
      # Va después de SCRUM-64 a propósito, por la misma razón por la que aquella
      # iba después de SCRUM-63: en serie es seguro compartir la base, en
      # paralelo no lo sería.
      #
      # El tiempo no se gasta: el reloj y el sleeper se inyectan, así que las
      # esperas de la política se observan sin que el runner duerma. Lo único
      # real aquí es PostgreSQL.
      - name: Pruebas de sincronización contra PostgreSQL (SCRUM-65)
        working-directory: backend
        env:
          SCRUM65_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_edge_sincronizacion_postgresql.py --junitxml=pytest-scrum65.xml

      # Octava capa: el esquema analítico y el ETL. A diferencia de las capas
      # anteriores, esta suite no escribe sobre la base del servicio: la usa
      # solo como conexión de mantenimiento para crear bases temporales propias
      # (prefijo scrum69_tmp_), migrarlas, cargar el dataset canónico, ejecutar
      # el ETL con commits reales -- rollback, candado, idempotencia -- y
      # eliminarlas al terminar. Solo elimina las que ella misma creó. El rol
      # efímero del servicio puede crear bases, y nada más lo necesita.
      #
      # Va la última y en serie, como todas: ninguna otra suite ve sus bases.
      - name: Pruebas del esquema analítico y el ETL contra PostgreSQL (SCRUM-69)
        working-directory: backend
        env:
          SCRUM69_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_etl_postgresql.py --junitxml=pytest-scrum69.xml

      # Novena capa: autenticacion, RBAC y auditoria. Como la del ETL, no
      # escribe sobre la base del servicio: la usa solo como conexion de
      # mantenimiento para crear bases temporales propias (prefijo
      # scrum70_tmp_), migrarlas, cargar el dataset canonico, autenticar
      # cuentas simuladas con hashes Argon2id reales y escribir auditoria con
      # commits de verdad, y eliminarlas al terminar. Solo elimina las que
      # ella misma creo.
      #
      # Necesita bases propias y no la transaccion revertida de las capas
      # anteriores: la auditoria del login y la de una denegacion usan una
      # transaccion propia que confirma, y un SAVEPOINT exterior no puede
      # contener un commit ajeno.
      #
      # Va la ultima y en serie, como todas.
      - name: Pruebas de autenticacion contra PostgreSQL (SCRUM-70)
        working-directory: backend
        env:
          SCRUM70_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_autenticacion_postgresql.py --junitxml=pytest-scrum70.xml

      # Decima capa: aprovisionamiento y ciclo de vida de cuentas. Como las dos
      # anteriores, usa el servicio solo como conexion de mantenimiento y crea
      # bases temporales propias (prefijo scrum97_tmp_): migra una base limpia y
      # una existente con las 37 cuentas, comprueba el CHECK de correo y el
      # trigger diferido rol/vinculo, provisiona con commits reales, desactiva y
      # reactiva, y lanza carreras con conexiones independientes. Los perfiles
      # sin cuenta que necesita se crean solo dentro de esas bases. Elimina
      # unicamente las bases que ella misma creo.
      #
      # Va la ultima y en serie, como todas: sus carreras toman candados
      # explicitos y no deben compartir el servidor con otra suite a la vez.
      - name: Pruebas de cuentas contra PostgreSQL (SCRUM-97)
        working-directory: backend
        env:
          SCRUM97_TEST_DATABASE_URL: postgresql+psycopg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
        run: python -m pytest -q -rs tests/test_cuentas_postgresql.py --junitxml=pytest-scrum97.xml

      # La variable de entorno de cada capa es lo único que evita que su archivo
      # quede omitido, y pytest devuelve 0 aunque se salte todo. Por eso los
      # reportes JUnit se revisan después: un solo <skipped> en cualquiera de
      # los nueve tumba el job.
      #
      # El guardián detecta **omisiones**. Los fallos y los errores los detecta
      # el código de salida de pytest, en el step que los produce. Son dos
      # comprobaciones distintas y ninguna sustituye a la otra.
      - name: Verificar que ninguna prueba de PostgreSQL quedó omitida
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # Reporte -> variable de entorno que lo mantiene vivo.
          REPORTES = {
              "pytest-postgresql.xml": "SCRUM52_TEST_DATABASE_URL",
              "pytest-scrum61.xml": "SCRUM61_TEST_DATABASE_URL",
              "pytest-scrum62.xml": "SCRUM62_TEST_DATABASE_URL",
              "pytest-scrum63.xml": "SCRUM63_TEST_DATABASE_URL",
              "pytest-scrum64.xml": "SCRUM64_TEST_DATABASE_URL",
              "pytest-scrum65.xml": "SCRUM65_TEST_DATABASE_URL",
              "pytest-scrum69.xml": "SCRUM69_TEST_DATABASE_URL",
              "pytest-scrum70.xml": "SCRUM70_TEST_DATABASE_URL",
              "pytest-scrum97.xml": "SCRUM97_TEST_DATABASE_URL",
          }

          fallo = False
          for reporte, variable in REPORTES.items():
              casos = ET.parse(reporte).getroot().findall(".//testcase")
              omitidos = [caso for caso in casos if caso.find("skipped") is not None]

              if not casos:
                  print(
                      f"::error::{reporte} no contiene ninguna prueba. Se esperaba "
                      "una ejecución real contra el servicio postgres:16."
                  )
                  fallo = True
                  continue

              if omitidos:
                  print(
                      "::error::Las pruebas de PostgreSQL quedaron OMITIDAS: "
                      f"{len(omitidos)} de {len(casos)} casos figuran como <skipped> "
                      f"en {reporte}. El Definition of Done exige que se ejecuten de "
                      "verdad contra el servicio postgres:16, no que se salten. "
                      f"Revisa {variable}: debe estar definida en el step que genera "
                      "ese reporte y apuntar a la base del servicio."
                  )
                  motivos = sorted(
                      {
                          (caso.find("skipped").get("message") or "").strip()
                          for caso in omitidos
                      }
                  )
                  for motivo in motivos:
                      print(f"::error::Motivo reportado por pytest: {motivo}")
                  fallo = True
                  continue

              print(
                  f"Verificación OK: {reporte} reporta {len(casos)} pruebas de "
                  "PostgreSQL ejecutadas, ninguna omitida."
              )

          sys.exit(1 if fallo else 0)
          PY
