name: CI

# Integración continua únicamente: instala, prueba y reporta.
# Este workflow no despliega nada ni publica artefactos.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Pruebas del backend (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Credenciales ficticias, efímeras y exclusivas de GitHub Actions:
          # viven solo dentro de este contenedor y desaparecen al terminar el
          # job. No son secretos, no corresponden a ningún entorno real y no
          # deben reutilizarse fuera de aquí. Por eso van en claro y no como
          # secrets del repositorio.
          POSTGRES_USER: fetalalert_ci
          POSTGRES_PASSWORD: ci_efimero_no_es_secreto
          # La base debe llamarse exactamente así: test_migration_postgresql.py
          # aborta contra cualquier otro nombre, porque el ciclo de validación
          # borra y recrea el esquema operacional completo.
          POSTGRES_DB: scrum52_validacion_tmp
        ports:
          - 5432:5432
        # pg_isready retiene el arranque de los steps hasta que el servidor
        # acepte conexiones, para que las pruebas no corran contra una base
        # todavía inicializándose.
        options: >-
          --health-cmd "pg_isready -U fetalalert_ci -d scrum52_validacion_tmp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Primera capa: todo lo que no necesita un servidor PostgreSQL
      # (API, modelos, migración renderizada offline, dataset simulado).
      - name: Pruebas sin servidor PostgreSQL
        working-directory: backend
        run: python -m pytest -q --ignore=tests/test_migration_postgresql.py

      # Segunda capa: ciclo real upgrade -> downgrade -> upgrade -> alembic check
      # contra el servicio PostgreSQL de arriba. La variable de entorno es lo
      # único que evita que este archivo quede omitido, y pytest devuelve 0
      # aunque se salte todo, así que el reporte JUnit se revisa después: un
      # solo <skipped> tumba el job.
      - name: Pruebas contra PostgreSQL
        working-directory: backend
        env:
          SCRUM52_TEST_DATABASE_URL: postgresql+psycopg://fetalalert_ci:ci_efimero_no_es_secreto@localhost:5432/scrum52_validacion_tmp
        run: |
          python -m pytest -q -rs tests/test_migration_postgresql.py --junitxml=pytest-postgresql.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          REPORTE = "pytest-postgresql.xml"

          casos = ET.parse(REPORTE).getroot().findall(".//testcase")
          omitidos = [caso for caso in casos if caso.find("skipped") is not None]

          if omitidos:
              print(
                  "::error::Las pruebas de PostgreSQL quedaron OMITIDAS: "
                  f"{len(omitidos)} de {len(casos)} casos figuran como <skipped> "
                  f"en {REPORTE}. SCRUM-60 exige que se ejecuten de verdad contra "
                  "el servicio postgres:16, no que se salten. Revisa "
                  "SCRUM52_TEST_DATABASE_URL: debe estar definida en este mismo "
                  "step y apuntar a la base scrum52_validacion_tmp del servicio."
              )
              motivos = sorted(
                  {(caso.find("skipped").get("message") or "").strip() for caso in omitidos}
              )
              for motivo in motivos:
                  print(f"::error::Motivo reportado por pytest: {motivo}")
              sys.exit(1)

          print(
              f"Verificación OK: {len(casos)} pruebas de PostgreSQL ejecutadas, "
              "ninguna omitida."
          )
          PY
